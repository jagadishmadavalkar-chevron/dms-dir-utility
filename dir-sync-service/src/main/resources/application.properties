# ============================================================
# Spring Boot — dir-sync-service
# ============================================================
spring.application.name=dir-sync-service
server.port=8080

# ============================================================
# Logging — Log4j2 (Logback excluded in pom.xml)
# ============================================================
logging.config=classpath:log4j2-spring.xml

# ============================================================
# Spring Batch
# ============================================================
# Prevent the job from running automatically at startup.
# Jobs are triggered via POST /api/jobs/trigger.
spring.batch.job.enabled=false

# In-memory job repository (no batch schema needed in app DB)
spring.batch.jdbc.initialize-schema=never

# ============================================================
# DataSource — used only by Spring Batch's JobRepository.
# The application DB connection (BuContext.conn) is opened
# manually by InitializationTasklet using the JDBC URL read
# from the D2 data dictionary, to preserve the original
# single-connection-per-run pattern.
# ============================================================
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
